[package]
name = "ers"
version = "0.1.0"
edition = "2024"
description = "Terminal ebook reader, a Rust port of epy"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
encoding_rs = "0.8.42"
html-escape = "0.2.15"
ratatui = "0.30.2"
regex = "1.13.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
tempfile = "3.27.0"
unicode-width = "0.2.2"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
